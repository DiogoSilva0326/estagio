services:
  api:
    image: ghcr.io/${GHCR_NAMESPACE:-synget1-0/ombro.org}/synget-api:${TAG:-1.0.0}
    depends_on:
      - db
      - gemini-api
    networks:
      - synget
    ports:
      - "${BACKEND_PORT:-9041}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080

      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${SQL_USER}
      - DB_PASSWORD=${SQL_PASSWORD}
      - DB_NAME=${SQL_DB}

      - JWT_SECRET=${JWT_SECRET}

      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_WEBHOOK_TOLERANCE_SECONDS=${STRIPE_WEBHOOK_TOLERANCE_SECONDS:-300}

      - CloudflareImages__AccountId=${CLOUDFLARE_IMAGES_ACCOUNT_ID:-}
      - CloudflareImages__ApiToken=${CLOUDFLARE_IMAGES_API_TOKEN:-}
      - CloudflareImages__DeliveryBase=${CLOUDFLARE_IMAGES_DELIVERY_BASE:-}

      - NACEX_USER=${NACEX_USER:-}
      - NACEX_PASSWORD=${NACEX_PASSWORD:-}
      - NACEX_DEFAULT_CUSTOMER_CODE=${NACEX_DEFAULT_CUSTOMER_CODE:-}
      - NACEX_DELEGATION_CODE=${NACEX_DELEGATION_CODE:-}
      - NACEX_SERVICE_TYPE=${NACEX_SERVICE_TYPE:-}
      - NACEX_PAYMENT_TYPE=${NACEX_PAYMENT_TYPE:-}
      - NACEX_PACKAGING_TYPE=${NACEX_PACKAGING_TYPE:-}
      - NACEX_LABEL_MODEL=${NACEX_LABEL_MODEL:-PDF_B}

      - DB_BOOTSTRAP=1
      - SITE_URL=${SITE_URL:-https://teste.synget.ovh}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@jacurvas.com}
      - POSTMARK_API_TOKEN=${POSTMARK_API_TOKEN:-}
      - POSTMARK_FROM_EMAIL=${POSTMARK_FROM_EMAIL:-}
      - POSTMARK_FORMS_FROM_EMAIL=${POSTMARK_FORMS_FROM_EMAIL:-}
      - POSTMARK_API_TOKEN_FORMS=${POSTMARK_API_TOKEN_FORMS:-${POSTMARK_API_TOKEN:-}}
      - POSTMARK_TO_EMAIL=${POSTMARK_TO_EMAIL:-info@synget.com}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}

      # Gemini proxy target (IMPORTANT: not localhost inside container)
      - GEMINI_API_URL=http://gemini-api:5300
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
    restart: unless-stopped

  gemini-api:
    image: ghcr.io/${GHCR_NAMESPACE:-synget1-0/ombro.org}/synget-gemini-api:${TAG:-1.0.0}
    networks:
      - synget
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5300

      # Real Gemini config
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}

      # Explicitly prevent accidental mock mode
      - GEMINI_ALLOW_MOCK=false
    expose:
      - "5300"
    restart: unless-stopped

  synget-site:
    image: ghcr.io/${GHCR_NAMESPACE:-synget1-0/ombro.org}/synget-site:${TAG:-1.0.0}
    depends_on:
      - api
    networks:
      - synget
    ports:
      - "${SITE_PORT:-8042}:80"
    restart: unless-stopped

  synget-admin:
    image: ghcr.io/${GHCR_NAMESPACE:-synget1-0/ombro.org}/synget-admin:${TAG:-1.0.0}
    depends_on:
      - api
    networks:
      - synget
    ports:
      - "${ADMIN_PORT:-8043}:80"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${SQL_USER:?SQL_USER is required}"
      POSTGRES_PASSWORD: "${SQL_PASSWORD:?SQL_PASSWORD is required}"
      POSTGRES_DB: "${SQL_DB:?SQL_DB is required}"
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackups:/backups
      - ./ConfidantPostgreSQL/docker/init-postgres-schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - synget
      - syngetdeploy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  db-backup:
    image: ${PG_BACKUP_IMAGE:-ghcr.io/${GHCR_NAMESPACE:-synget1-0/ombro.org}/pg-backup:${TAG:-1.0.0}}
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SQL_USER=${SQL_USER}
      - SQL_PASSWORD=${SQL_PASSWORD}
      - SQL_DB=${SQL_DB}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}
      - DB_HOST=db
      - DB_PORT=5432
      - BACKUP_DIR=/backups
    volumes:
      - pgbackups:/backups
    networks:
      - synget
    restart: unless-stopped

  backup-fileserver:
    image: nginx:1.27.2-alpine
    depends_on:
      - db-backup
    volumes:
      - pgbackups:/usr/share/nginx/html:ro
    ports:
      - "9045:80"
    networks:
      - synget
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        cat <<'EOF' >/etc/nginx/conf.d/default.conf
        server {
            listen       80;
            listen       [::]:80;
            server_name  _;

            root /usr/share/nginx/html;

            location / {
                autoindex on;
                autoindex_exact_size off;
                autoindex_localtime on;
                add_header Cache-Control "no-store" always;
            }
        }
        EOF
        exec nginx -g 'daemon off;'

  orders-status-cron:
    image: curlimages/curl:8.5.0
    depends_on:
      - api
    environment:
      - BASE_URL=http://api:8080
    entrypoint:
      ["/bin/sh", "-c", "while true; do echo \"[$(date -u +%FT%TZ)] PUT $$BASE_URL/api/Orders/UpdateStatus\"; curl -sS -X PUT \"$$BASE_URL/api/Orders/UpdateStatus\" -w \" HTTP %{http_code}\\n\" -o /dev/null; sleep 60; done"]
    networks:
      - synget
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@confidant.local.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "9060:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - pgbackups:/backups
    networks:
      - synget
    restart: unless-stopped

volumes:
  pgdata:
  pgbackups:
  pgadmin_data:

networks:
  synget:
    driver: bridge
  syngetdeploy:
    driver: bridge