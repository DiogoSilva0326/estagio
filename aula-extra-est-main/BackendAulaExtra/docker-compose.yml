services:
  confidant:
    depends_on:
      - db
    platform: "linux/amd64"
    build:
      context: .
      dockerfile: Dockerfile
    image: confidantapi:1.0.0
    networks: [confidant]
    ports:
      - "9080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_DETAILEDERRORS=true
      - ASPNETCORE_URLS=http://+:8080
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${SQL_USER}
      - DB_PASSWORD=${SQL_PASSWORD}
      - DB_NAME=${SQL_DB}
      - JWT_SECRET=${JWT_SECRET}
      - POSTMARK_API_TOKEN=${POSTMARK_API_TOKEN}
      - POSTMARK_FROM_EMAIL=${POSTMARK_FROM_EMAIL}
      - POSTMARK_NEWSLETTER_FROM_EMAIL=${POSTMARK_NEWSLETTER_FROM_EMAIL:-${POSTMARK_FROM_EMAIL_NEWSLETTER:-${POSTMARK_FROM_EMAIL}}}
      - CLOUDFLARE_IMAGES_ACCOUNT_ID=${CLOUDFLARE_IMAGES_ACCOUNT_ID}
      - CLOUDFLARE_IMAGES_API_TOKEN=${CLOUDFLARE_IMAGES_API_TOKEN}
      - CLOUDFLARE_IMAGES_DELIVERY_BASE=${CLOUDFLARE_IMAGES_DELIVERY_BASE}
      - CLOUDFLARE_IMAGES_DEFAULT_VARIANT=${CLOUDFLARE_IMAGES_DEFAULT_VARIANT:-public}
      - AGORA_INTEGRATOR_BASE_URL=${AGORA_INTEGRATOR_BASE_URL:-http://agoraintegrator}
      - AGORA_APP_ID=${AGORA_APP_ID:-${AGORA_APPID:-}}
      - WHITEBOARD_APP_IDENTIFIER=${WHITEBOARD_APP_IDENTIFIER:-}
      - WHITEBOARD_REGION=${WHITEBOARD_REGION:-us-sv}
      - DB_BOOTSTRAP=0
    restart: unless-stopped

  frontend:
    platform: "linux/amd64"
    build:
      context: ..
      dockerfile: AulaExtraDeployServer/Dockerfile.frontend
      args:
        API_BASE_URL: http://localhost:9080
        CHAT_HUB_BASE_URL: http://localhost:5050
        APP_BASE_HREF: /
    image: aulaextra-frontend:local
    depends_on:
      - confidant
    networks: [confidant]
    ports:
      - "3000:80"
    restart: unless-stopped

  backoffice:
    platform: "linux/amd64"
    build:
      context: ..
      dockerfile: AulaExtraDeployServer/Dockerfile.backoffice
      args:
        API_BASE_URL: http://localhost:9080
        APP_BASE_HREF: /
    image: aulaextra-backoffice:local
    depends_on:
      - confidant
    networks: [confidant]
    ports:
      - "3001:80"
    restart: unless-stopped

  db:
    # Postgres official images are multi-arch but set platform if host requires emulation
    platform: "linux/amd64"
    image: postgres:16-alpine
    container_name: confidantpostgresAulaExtra
    environment:
      POSTGRES_USER: "${SQL_USER}"
      POSTGRES_PASSWORD: "${SQL_PASSWORD}"
      POSTGRES_DB: "${SQL_DB}"
    ports:
      - "5432:5432"
    networks: [confidant, confidantdeploy]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Intentionally no initdb.d SQL mounts.
      # Use `migration/apply_ddl_to_postgres.sh` to create schemas/tables/procs deterministically.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 15

  adminer:
    platform: "linux/amd64"
    image: adminer:latest
    container_name: confidant-adminerAulaExtra
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "9082:8080"        # abre em http://localhost:9082
    networks:
      - confidant
    restart: unless-stopped

  pgadmin:
    platform: "linux/amd64"
    image: dpage/pgadmin4:latest
    container_name: confidant-pgadminAulaExtra
    depends_on:
      - db
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@confidant.pt
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "9084:80"          # abre em http://localhost:9084 (changed to avoid host port conflict)
    networks:
      - confidant
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./backups/pgadmin:/var/lib/pgadmin/storage/admin_confidant.pt
    restart: unless-stopped

  db-backup:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      SQL_USER: "${SQL_USER}"
      SQL_PASSWORD: "${SQL_PASSWORD}"
      SQL_DB: "${SQL_DB}"
      DB_HOST: db
      DB_PORT: "5432"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
      - ./pg-backup/run-backup.sh:/usr/local/bin/run-backup.sh:ro
    networks:
      - confidant
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/run-backup.sh"]

  orders-status-cron:
    image: curlimages/curl:8.5.0
    depends_on:
      - confidant
    environment:
      - BASE_URL=http://confidant:8080
    entrypoint: ["/bin/sh", "-c", "while true; do echo \"[$(date -u +%FT%TZ)] PUT $$BASE_URL/api/Orders/UpdateStatus\"; curl -sS -X PUT \"$$BASE_URL/api/Orders/UpdateStatus\" -w \" HTTP %{http_code}\\n\" -o /dev/null; sleep 60; done"]
    networks: [confidant]
    restart: unless-stopped

  filemanager:
    platform: "linux/amd64"
    image: filebrowser/filebrowser:latest
    container_name: filemanagerAulaExtra
    depends_on:
      - db
    volumes:
      - ./backups:/srv
    ports:
      - "19067:80"
    networks:
      - confidant
    restart: unless-stopped
    command: --noauth

  agoraintegrator:
    platform: "linux/amd64"
    build:
      # Build context must include the solution and sibling projects
      context: ./AgoraIntegrator/Src
      dockerfile: Synget.AgoraIntegrator.API/Dockerfile
    image: synget/agoraintegrator:1.0.0
    container_name: agoraintegrator
    depends_on:
      - db
      - r2integrator
    networks: [confidant]
    ports:
      - "5050:80"  # maps container port 80 to host 5005
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_DETAILEDERRORS=true
      - ASPNETCORE_URLS=http://+:80
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${SQL_USER}
      - DB_PASSWORD=${SQL_PASSWORD}
      - DB_NAME=${SQL_DB}
      # Agora & Whiteboard settings (configure via env or .env file)
      - Agora__AppId=${AGORA_APPID:-}
      - Agora__AppCertificate=${AGORA_APPCERT:-}
      - Whiteboard__NetlessSdkToken=${WHITEBOARD_NETLESS_SDK_TOKEN:-}
      - Whiteboard__AppIdentifier=${WHITEBOARD_APP_IDENTIFIER:-}
      - Whiteboard__Region=${WHITEBOARD_REGION:-}
      - R2_INTEGRATOR_BASE_URL=${R2_INTEGRATOR_BASE_URL:-http://r2integrator}
    restart: unless-stopped

  r2integrator:
    platform: "linux/amd64"
    build:
      context: ./R2_Integrator/src
      dockerfile: Synget_R2.Integrator.API/Dockerfile
    image: synget/r2integrator:1.0.0
    container_name: r2integrator
    networks: [confidant]
    ports:
      - "5051:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - CloudflareR2__AccountId=${CloudflareR2__AccountId:-}
      - CloudflareR2__BucketName=${CloudflareR2__BucketName:-aulaextra}
      - CloudflareR2__AccessKeyId=${CloudflareR2__AccessKeyId:-}
      - CloudflareR2__SecretAccessKey=${CloudflareR2__SecretAccessKey:-}
      - CloudflareR2__ApiToken=${CloudflareR2__ApiToken:-}
      - CloudflareR2__PublicBaseUrl=${CloudflareR2__PublicBaseUrl:-https://pub-d43335aacc3b40cb9c77ba3666318eb8.r2.dev}
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin_data:

networks:
  confidant: { driver: bridge }
  confidantdeploy: { driver: bridge }
